<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rabbithole · Drink me</title>
<meta name="description" content="Paste one line into an AI agent on your computer and go down the rabbit hole.">
<link rel="alternate" type="text/markdown" href="/drink-me" title="Instructions for agents">
<style>
  /* One screen at night: the rabbit on its moon, and the one line to copy.
     The agent explains everything else, so the page says almost nothing. */
  :root {
    color-scheme: dark;
    --sky-1: #3B2E7E; --sky-2: #221A4D; --sky-3: #0C0A18;
    --ink: #F3F0FF; --dim: #A99FD8;
    --tag: #F4E9C8; --tag-ink: #2A1C05; --go: #63D5C8; --go-ink: #072421;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hanken Grotesk", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--sky-3) linear-gradient(150deg, var(--sky-1) 0%, var(--sky-2) 42%, var(--sky-3) 100%) fixed;
    color: var(--ink); font: 17px/1.55 var(--font);
  }
  button:focus-visible { outline: 2px solid var(--go); outline-offset: 3px; }
  main { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; overflow: hidden; }
  img.art {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 78% 40%;
    pointer-events: none;
  }
  main::after { /* keep the line readable over the art */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(12,10,24,.9) 0%, rgba(12,10,24,.6) 42%, rgba(12,10,24,0) 70%);
  }
  .door { position: relative; z-index: 1; width: 100%; max-width: 72rem; margin: 0 auto; padding: 3rem 20px; }
  .door > * { max-width: 35rem; }
  h1 { font-size: clamp(2.6rem, 2rem + 3vw, 4rem); line-height: 1.05; margin: 0; letter-spacing: -.02em; }
  .bottle {
    position: relative; margin-top: 2.6rem; background: rgba(11,9,24,.82); border: 1px solid rgba(255,255,255,.16);
    border-radius: 14px; padding: 1.6rem .7rem .7rem 1rem; display: grid; grid-template-columns: 1fr auto; gap: .6rem; align-items: center;
  }
  .bottle .tagpaper {
    position: absolute; top: -.85rem; left: 1.1rem; transform: rotate(-3deg);
    background: var(--tag); color: var(--tag-ink); font-weight: 750; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase;
    padding: .3rem .75rem .3rem 1.3rem; border-radius: 3px 8px 8px 3px; box-shadow: 0 4px 10px -4px #000;
  }
  .bottle .tagpaper::before { content: ""; position: absolute; left: .48rem; top: 50%; width: .4rem; height: .4rem; margin-top: -.2rem; border-radius: 50%; background: #0B0918; }
  .bottle code { font: 1rem/1.5 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
  .bottle code .url { white-space: nowrap; } /* never split the address at "drink-" */
  button.copy-btn {
    font: 700 .85rem var(--font); letter-spacing: .03em; border: 0; border-radius: 10px; cursor: pointer;
    padding: .7rem 1.05rem; background: var(--go); color: var(--go-ink); min-width: 6.5rem;
  }
  button.copy-btn:hover { filter: brightness(1.08); }
  .hint { color: var(--dim); font-size: .95rem; margin: 1rem 0 0; }
  @media (max-width: 720px) { /* on a phone the rabbit gets its own band above the line */
    main { display: block; }
    img.art { position: static; display: block; height: 300px; object-position: 82% 38%;
      -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
    main::after { display: none; }
    .door { padding-top: .5rem; }
  }
  @media (max-width: 560px) { .bottle { grid-template-columns: 1fr; } .bottle code { font-size: .8125rem; } button.copy-btn { justify-self: start; } }
  @media (max-width: 359px) { .bottle code .url { white-space: normal; } }
  @media (prefers-reduced-motion: no-preference) { .bottle { animation: rise .6s ease-out both; } @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } } }
</style>
</head>
<body>
  <main>
    <img class="art" src="/hero.webp" alt="" width="1600" height="855">
    <div class="door">
      <h1>Rabbithole</h1>
      <div class="bottle">
        <span class="tagpaper">Drink me</span>
        <code id="line">Read <span class="url">drink-me.rabbithole.school/drink-me</span> and take me down the rabbit hole.</code>
        <button class="copy-btn" type="button" id="copy">Copy</button>
      </div>
      <p class="hint">Paste it into Claude Code, or any AI agent on your computer.</p>
    </div>
  </main>
  <script>
    (function () {
      var btn = document.getElementById("copy"), line = document.getElementById("line");
      btn.addEventListener("click", function () {
        var text = line.textContent.trim();
        var done = function (label) { btn.textContent = label; setTimeout(function () { btn.textContent = "Copy"; }, 1800); };
        var select = function () {
          var r = document.createRange(); r.selectNodeContents(line);
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); done("Selected");
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { done("Copied"); }, select);
        } else { select(); }
      });
    })();
  </script>
</body>
</html>
